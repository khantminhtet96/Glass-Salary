<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glass Salary • Settings</title><link rel="stylesheet" href="styles.css"></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><header class="topbar glass"><div class="brand"><div class="logo">₿</div><div><b>Glass Salary</b><small>လစာစီမံခန့်ခွဲမှု</small></div></div><nav><a href="index.html">Dashboard</a><a href="calendar.html">Calendar</a><a href="employees.html">Employees</a><a class="active" href="settings.html">Settings</a></nav></header><main class="wrap"><section class="card glass settings"><h1>⚙️ လစာဆက်တင်</h1><p class="muted">အောက်ပါအချက်အလက်တွေကို ကိုယ်တိုင်ပြောင်းနိုင်ပါတယ်။</p><div class="formgrid"><label>တစ်ရက်လုပ်ခ (฿)<input id="dailyWage" type="number" min="0" step="1"></label><label>လစာစရက်<input id="startDay" type="number" min="1" max="31"></label><label>လစာပိတ်ရက်<input id="endDay" type="number" min="1" max="31"></label><label>စတင်လ (ဥပမာ)<input id="baseMonth" type="month"></label></div><div class="settingsnote">💡 ဥပမာ — စရက် 26 / ပိတ်ရက် 25 ဆိုရင် 26 ရက်ကနေ နောက်လ 25 ရက်အထိ လစာကာလဖြစ်ပါမယ်။</div><button class="btn save" onclick="saveSettings()">သိမ်းမည် ✓</button><div id="toast" class="toast"></div></section></main><script src="app.js"></script><script>initSettings()</script></body></html>
