<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glass Salary • Calendar</title><link rel="stylesheet" href="styles.css"></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><header class="topbar glass"><div class="brand"><div class="logo">₿</div><div><b>Glass Salary</b><small>လစာစီမံခန့်ခွဲမှု</small></div></div><nav><a href="index.html">Dashboard</a><a class="active" href="calendar.html">Calendar</a><a href="employees.html">Employees</a><a href="settings.html">Settings</a></nav></header><main class="wrap"><section class="card glass"><div class="cardhead"><div><h1>📅 အလုပ်ဆင်း / ပိတ်ရက်</h1><p class="muted">အပြာ = အလုပ်ဆင်း • အနီ = ပိတ်ရက်</p></div><div class="legend"><span class="dot work"></span> အလုပ် <span class="dot offdot"></span> ပိတ်</div></div><div class="calendarbar"><button class="iconbtn" onclick="changeMonth(-1)">‹</button><h2 id="monthTitle"></h2><button class="iconbtn" onclick="changeMonth(1)">›</button></div><div id="calendar" class="calendar"></div><div class="actions"><button class="btn blue" onclick="setAll('work')">အလုပ်ဆင်းအားလုံး</button><button class="btn red" onclick="setAll('off')">ပိတ်ရက်အားလုံး</button><button class="btn" onclick="saveAndRefresh()">သိမ်းမည် ✓</button></div></section></main><script src="app.js"></script><script>initCalendar()</script></body></html>
